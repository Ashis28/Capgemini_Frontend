<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var laptops = [
            {id:"1",brand:"HP",price : 100000,quantity:8},
            {id:"2",brand:"DELL",price : 80000,quantity:5},
            {id:"3",brand:"LENOVO",price : 120000,quantity:7},
            {id:"4",brand:"ASUS",price : 80000,quantity:7}
        ]
    </script>
    <button onclick="method3()">View Laptops Dynamic</button>
    <br>
    <table id="t3" style="display: none; border: 2px solid blue;">
        <th>ID</th>
        <th>brand</th>
        <th>Price</th>
        <th>quanity</th>
        <th>Liked</th>
    </table>
    <Button onclick="liekd()"></Button>

    <script>
        function liked(btn){
                var td = btn.parentElement;
                console.log(td);
                var dislikeBtn = td.querySelector("button:nth-child(2)")
                dislikeBtn.remove();

                var tr = btn.closest('tr');
                tr.style.backgroundColor = 'green';
            }

        function disLiked(btn){
                var td = btn.parentElement;
                console.log(td);
                var likeBtn = td.querySelector("button:nth-child(1)")
                likeBtn.remove();

                 var tr = btn.closest('tr');
                tr.style.backgroundColor = 'red';
            }
        function method3(){
            let t3 = document.getElementById('t3');
            t3.style.display = 'inline';
            for(let laptop of laptops){
                var tr = document.createElement('tr');
                for(let key of Object.keys(laptop)){
                    tr.insertCell().innerText = laptop[key];
                }
                var tdLike = document.createElement('td');
                var buttons = '<Button id = "liked" onclick="liked(this)">❤️</Button"> <Button id = "disliked" onclick="disLiked(this)">👎</Button">';
                tdLike.innerHTML = buttons;
                tr.append(tdLike);
                t3.appendChild(tr);
            }
        }
    </script>
    <button onclick="showLiked()">showLiked</button>
    <button onclick="showDisliked()">showDislied</button>
    <script>
        function showLiked(){
            var tr = document.getElementsByTagName("tr");
            // skipping 0 for header
            for(let i=1;i<tr.length;i++){
                var td = tr[i].lastElementChild;
                console.log("last element of row",td);
                tr[i].style.display = 'flex';
                if(td.querySelector("#disliked")){
                    tr[i].style.display = 'none';
                    console.log("tr[i] ")
                }
                else{
                    console.log("Not printing");
                }
            }

        }
        function showDisliked(){
            var tr = document.getElementsByTagName("tr");
            // skipping 0 for header
            for(let i=1;i<tr.length;i++){
                var td = tr[i].lastElementChild;
                tr[i].style.display = 'flex';
                if(td.querySelector("#liked")){
                    tr[i].style.display = 'none';
                }
                else{
                    console.log("Not printing");
                }
            }
        }
    </script>
</body>
</html>
