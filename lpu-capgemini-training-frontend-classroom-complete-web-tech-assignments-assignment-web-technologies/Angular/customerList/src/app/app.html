
<p>Hello word</p>
<div class="container">
  @for(customer of customersTemp;track customer.id){
    <div class="card">
      <p><b>ID:</b> {{ customer.id }}</p>
      <p><b>Name:</b> {{ customer.name }}</p>
      <p><b>Email:</b> {{ customer.email }}</p>
      <p><b>Phone:</b> {{ customer.phone }}</p>
    </div>
  }
</div>
