<div class="wrapper">

  <h2>Customer List</h2>
  <div class="search-box">
    <input
      type="text"
      placeholder="Search by name..."
      [(ngModel)]="searchText"
      (input)="onSearchChange()"
    />
  </div>

  <div class="card-container">
    @for(customer of pagignation; track customer.id){
      <div class="card">
        <h3>{{ customer.name }}</h3>
        <p><span>ID:</span> {{ customer.id }}</p>
        <p><span>Email:</span> {{ customer.email }}</p>
        <p><span>Phone:</span> {{ customer.phone }}</p>
        <p><span>Address:</span> {{ customer.address }}</p>
        <p><span>Gender:</span> {{ customer.gender }}</p>
      </div>
    }
  </div>

  <div class="pagination">
    <button (click)="prevPagePagignation()" [disabled]="isFirstPage()">Previous</button>
    <span>Page {{ currentPage }}</span>
    <button (click)="nextPagePagignation()" [disabled]="isLastPage()">Next</button>
  </div>

</div>
